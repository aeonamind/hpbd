apiVersion: apps/v1
kind: Deployment
metadata:
  name: birthday
  labels: { app: birthday }
spec:
  replicas: 1
  selector:
    matchLabels: { app: birthday }
  template:
    metadata:
      labels: { app: birthday }
    spec:
      containers:
        - name: web
          image: her-birthday
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: birthday-config }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
